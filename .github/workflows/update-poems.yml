name: Update Poems from YouTube

# Keeps public/data/poems.json in sync with the YouTube channel,
# then explicitly dispatches the Deploy workflow.

on:
  schedule:
    # Every day at 00:30 UTC (06:00 IST)
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # Required by `gh workflow run` below. A push made with GITHUB_TOKEN does
  # NOT trigger other workflows, so Deploy has to be dispatched by hand.
  actions: write

concurrency:
  group: update-poems
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Fetch latest poems
        run: python scripts/update_poems.py

      - name: Commit changes if any
        id: commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          if [ ! -f public/data/poems.json ]; then
            echo "poems.json was not produced — nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add public/data/poems.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
          else
            git commit -m "chore: sync poems from YouTube"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
